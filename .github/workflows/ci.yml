name: SME Banking CI Pipeline

on:
  push:
    branches:
      - main
      - staging
      - qa

  pull_request:
    branches:
      - main
      - staging
      - qa

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Project Files
        run: |
          pwd
          ls -la
          find . -maxdepth 3 -type f | sort